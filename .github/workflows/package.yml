name: Validate skill package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py --check
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: capsule-travel
          path: dist/capsule-travel.zip
